<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipFetch — Simple media downloads</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--muted:#94a3b8;--line:#26334d;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#1c2b50 0,var(--bg) 55%);font:16px system-ui;color:#eef2ff;min-height:100vh}
header{max-width:1000px;margin:auto;padding:26px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo span{color:var(--accent)}
.pill{font-size:12px;color:#cbd5e1;border:1px solid var(--line);padding:7px 11px;border-radius:99px}
main{max-width:850px;margin:8vh auto 0;padding:24px 20px;text-align:center}
h1{font-size:clamp(34px,6vw,54px);line-height:1.08;letter-spacing:-1.8px;margin:0 0 16px}
.sub{color:var(--muted);font-size:17px;margin-bottom:34px}
.card{background:rgba(18,26,46,.92);border:1px solid var(--line);padding:22px;border-radius:18px;box-shadow:0 24px 80px #0005}
.row{display:flex;gap:10px}.row input{min-width:0;flex:1;background:#0b1224;border:1px solid #34415e;border-radius:11px;padding:16px;color:white;font-size:15px;outline:none}
button{border:0;border-radius:11px;background:var(--accent);color:#081126;font-weight:750;padding:0 23px;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
#result{display:none;text-align:left;margin-top:18px}.media{display:flex;gap:15px;align-items:center;margin-bottom:16px}
.media img{width:112px;height:68px;object-fit:cover;border-radius:8px;background:#0b1224}
select{width:100%;padding:14px;border-radius:10px;background:#0b1224;color:white;border:1px solid #34415e;margin-bottom:12px}
#download{height:48px;width:100%}#status{margin-top:16px;color:#cbd5e1;font-size:14px;overflow-wrap:anywhere}
#progress{display:none;text-align:left;margin-top:20px;padding:17px;background:#0b1224;border:1px solid var(--line);border-radius:12px}
.progress-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14px;font-weight:650}
#progress-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress-track{height:5px;margin:13px 0 15px;background:#26334d;border-radius:99px;overflow:hidden}
.progress-track::after{content:"";display:block;width:35%;height:100%;background:var(--accent);border-radius:inherit;transform:translateX(-110%);animation:progress-sweep 1.35s ease-in-out infinite}
#progress[data-state="complete"] .progress-track::after{width:100%;transform:none;animation:none}
#progress[data-state="error"] .progress-track::after{width:100%;background:#fb7185;transform:none;animation:none}
@keyframes progress-sweep{to{transform:translateX(300%)}}
.progress-steps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.progress-step{display:flex;align-items:center;gap:10px;color:#64748b;font-size:13px}
.step-number{width:23px;height:23px;display:grid;place-items:center;flex:none;border:1px solid #34415e;border-radius:50%;font-size:11px;font-weight:700}
.progress-step[data-state="active"]{color:#eef2ff}.progress-step[data-state="active"] .step-number{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px #7c9cff22}
.progress-step[data-state="complete"]{color:#a5b4fc}.progress-step[data-state="complete"] .step-number{background:var(--accent);border-color:var(--accent);color:#081126}
.progress-step[data-state="error"]{color:#fda4af}.progress-step[data-state="error"] .step-number{border-color:#fb7185;color:#fb7185}
footer{color:#64748b;font-size:12px;text-align:center;margin:48px 20px 25px}
@media(max-width:560px){.row{flex-direction:column}.row button{height:50px}.card{padding:15px}main{margin-top:5vh}}
@media(prefers-reduced-motion:reduce){.progress-track::after{animation:none;transform:none}}
</style>
</head>
<body>
<header><div class="logo">Clip<span>Fetch</span></div><div class="pill">Simple · Fast · No account</div></header>
<main>
<h1>Media, made <span style="color:var(--accent)">easy.</span></h1>
<p class="sub">Paste a public media link to check available formats.</p>
<section class="card">
<div class="row"><input id="url" type="url" placeholder="Paste video URL here…" autocomplete="url"><button id="go">Analyze URL</button></div>
<div class="hint">Only download media you own or are authorized to save. DRM and access controls are not bypassed.</div>
<div id="result">
<div class="media"><img id="thumb" alt=""><div><strong id="title"></strong><div class="hint">Choose an available format</div></div></div>
<select id="formats"></select><button id="download">Prepare download</button>
</div>
<div id="progress" role="region" aria-label="Task progress" aria-live="polite" data-state="working">
<div class="progress-heading"><span id="progress-label"></span><span id="progress-count"></span></div>
<div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuetext="In progress"></div>
<ol id="progress-steps" class="progress-steps"></ol>
</div>
<div id="status" role="status" aria-live="polite"></div>
</section>
</main>
<footer>ClipFetch · Use responsibly and respect creators’ rights.</footer>
<script>
const $=id=>document.getElementById(id);let currentUrl="";
let progressTimer;
function showProgress(label,steps,activeIndex){
 clearInterval(progressTimer);
 const panel=$("progress");panel.style.display="block";panel.dataset.state="working";
 $("progress-label").textContent=label;
 $("progress-count").textContent=`Step ${activeIndex+1} of ${steps.length}`;
 const bar=panel.querySelector('[role="progressbar"]');bar.removeAttribute("aria-valuenow");bar.setAttribute("aria-valuetext",`Step ${activeIndex+1} of ${steps.length}: ${steps[activeIndex]}`);
 $("progress-steps").replaceChildren(...steps.map((step,index)=>{
  const item=document.createElement("li");item.className="progress-step";
  item.dataset.state=index<activeIndex?"complete":index===activeIndex?"active":"pending";
  const number=document.createElement("span");number.className="step-number";number.textContent=index<activeIndex?"✓":String(index+1);
  const text=document.createElement("span");text.textContent=step;
  item.append(number,text);return item;
 }));
}
function finishProgress(state,label,steps){
 clearInterval(progressTimer);
 const panel=$("progress");panel.dataset.state=state;
 $("progress-label").textContent=label;
 const completed=state==="complete"?steps.length:Math.max(0,Number(panel.dataset.activeIndex)||0);
 $("progress-count").textContent=state==="complete"?`Step ${steps.length} of ${steps.length}`:"Needs attention";
 const bar=panel.querySelector('[role="progressbar"]');bar.setAttribute("aria-valuenow",state==="complete"?"100":"0");bar.setAttribute("aria-valuetext",label);
 $("progress-steps").replaceChildren(...steps.map((step,index)=>{
  const item=document.createElement("li");item.className="progress-step";
  item.dataset.state=state==="error"&&index===completed?"error":index<completed?"complete":"pending";
  const number=document.createElement("span");number.className="step-number";number.textContent=index<completed?"✓":String(index+1);
  const text=document.createElement("span");text.textContent=step;
  item.append(number,text);return item;
 }));
}
function setActiveStep(index,steps,label){
 const panel=$("progress");panel.dataset.activeIndex=String(index);
 showProgress(label,steps,index);
 panel.dataset.activeIndex=String(index);
}
const analyzeSteps=["Validate link","Inspect media source","Load available formats"];
const downloadSteps=["Start download job","Download and process media","File ready"];
$("go").onclick=async()=>{
 const url=$("url").value.trim(); if(!url){$("status").textContent="Paste a URL first.";return}
 $("go").disabled=true;$("status").textContent="";$("result").style.display="none";
 setActiveStep(0,analyzeSteps,"Analyzing link");
 progressTimer=setTimeout(()=>setActiveStep(1,analyzeSteps,"Checking the media source"),450);
 try{
  const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
  const d=await r.json();if(!r.ok)throw Error(d.detail||"Could not analyze this URL.");
  setActiveStep(2,analyzeSteps,"Loading available formats");
  currentUrl=url;$("title").textContent=d.title;$("thumb").src=d.thumbnail||"";
  $("formats").innerHTML="";
  d.formats.forEach(f=>{let o=document.createElement("option");o.value=f.id;o.textContent=f.label+" · "+f.ext;$("formats").appendChild(o)});
  if(!d.formats.length)throw Error("No downloadable formats were found.");
  $("result").style.display="block";finishProgress("complete","Analysis complete",analyzeSteps);
 }catch(e){finishProgress("error","Analysis could not be completed",analyzeSteps);$("status").textContent=e.message}
 finally{$("go").disabled=false}
};
$("download").onclick=async()=>{
 $("download").disabled=true;$("status").textContent="";
 setActiveStep(0,downloadSteps,"Starting your download");
 progressTimer=setTimeout(()=>setActiveStep(1,downloadSteps,"Downloading and processing your file"),500);
 try{
  const r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:currentUrl,format_id:$("formats").value})});
  const d=await r.json();if(!r.ok)throw Error(d.detail||"Could not start download.");
  setActiveStep(1,downloadSteps,"Downloading and processing your file");
  const poll=async()=>{
   try{
    const response=await fetch("/api/status/"+encodeURIComponent(d.job_id));
    const s=await response.json();if(!response.ok)throw Error(s.detail||"Could not check download status.");
    if(s.status==="done"){
     setActiveStep(2,downloadSteps,"Your file is ready");
     $("status").innerHTML="Your file is ready. <a style='color:#9db4ff' href='/api/file/"+encodeURIComponent(d.job_id)+"'>Download file</a>";
     finishProgress("complete","Download ready",downloadSteps);$("download").disabled=false;return;
    }
    if(s.status==="error")throw Error(s.error||"Download failed.");
    setActiveStep(1,downloadSteps,"Downloading and processing your file");setTimeout(poll,1800);
   }catch(e){finishProgress("error","Download could not be completed",downloadSteps);$("status").textContent=e.message;$("download").disabled=false}
  };
  poll();
 }catch(e){finishProgress("error","Download could not be started",downloadSteps);$("status").textContent=e.message;$("download").disabled=false}
};
</script>
</body></html>
